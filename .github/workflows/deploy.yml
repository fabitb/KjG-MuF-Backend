name: Deploy Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Docker container
        uses: appleboy/ssh-action@v0.1.2
        with:
          host: ${{secrets.STAGING_SERVER_HOST}}
          username: ${{ secrets.STAGING_SERVER_USER_NAME }}
          key: ${{ secrets.STAGING_SERVER_PRIVATE_KEY }}
          script: |
            cd KjG-MuF-Backend/

            # Pull latest code
            git pull

            # Ensure .env file exists (create from example if missing)
            if [ ! -f .env ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
              echo "⚠️  WARNING: Please update .env with production credentials!"
            fi

            # Build and deploy with Docker Compose
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d

            # Show status
            docker compose ps

            # Show recent logs to verify deployment
            docker compose logs --tail=50 backend-prod