version: '3.9'

services:
  # MongoDB database service (shared across profiles)
  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-app-db}
      # Uncomment for production authentication:
      # MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      # MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend service - Development profile
  backend-dev:
    build:
      context: .
      target: development
    container_name: backend-dev
    profiles: ["dev"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongodb:27017
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - ./source:/app/source:delegated
      # Prevent overwriting container's node_modules
      - /app/node_modules
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  # Backend service - Production profile
  backend-prod:
    build:
      context: .
      target: production
    container_name: backend-prod
    profiles: ["prod"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # MONGODB_URI and MONGODB_DATABASE come from .env file
      # Can point to external MongoDB or the Docker MongoDB service
    ports:
      - "3000:3000"
    # Uncomment if using Docker MongoDB container:
    # depends_on:
    #   mongodb:
    #     condition: service_healthy
    #   networks:
    #     - app-network
    # For external MongoDB on host machine (127.0.0.1), use host network:
    network_mode: host
    # For remote MongoDB, comment out network_mode and uncomment networks:
    # networks:
    #   - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
